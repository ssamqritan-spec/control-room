services:
  - type: web
    name: bursary-control-room
    runtime: node
    rootDir: admin
    buildCommand: npm run check
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
